# Úpravy /etc/haproxy/haproxy.cfg – doplnit do STÁVAJÍCÍ konfigurace, nic nemazat.
# Názvy frontendů (http_in / https_in) nahraď těmi, které už v konfiguraci máš.

# --- frontend na :443 (TLS) ---
# Certifikát: přidej soubor do adresáře, ze kterého HAProxy bere certy (crt /etc/haproxy/certs/),
# nebo připiš "crt /etc/haproxy/certs/aijunior.opicebot.cz.pem" na řádek bind :443.
#
#   acl host_aijunior hdr(host) -i aijunior.opicebot.cz
#   use_backend aijunior_backend if host_aijunior

# --- frontend na :80 ---
# Beze změny: stávající http-in už přesměrovává vše na HTTPS a ACME posílá na acme_backend.

# --- nový backend ---
backend aijunior_backend
    mode http
    option forwardfor
    http-request set-header X-Forwarded-Proto https
    server aijunior_apache 127.0.0.1:8081 check
