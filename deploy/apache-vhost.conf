# /etc/apache2/sites-available/aijunior.conf
# Apache poslouchá jen lokálně – ven ho publikuje HAProxy (TLS se ukončuje na HAProxy).
# Vyžaduje: a2enmod proxy_fcgi setenvif remoteip headers rewrite; a2enconf php8.3-fpm

<VirtualHost 127.0.0.1:8081>
    ServerName aijunior.opicebot.cz

    # Repo leží v /var/www/aijunior, ven je vidět jen public/ (.env a config.php jsou o úroveň výš)
    DocumentRoot /var/www/aijunior/public

    <Directory /var/www/aijunior/public>
        Options -Indexes -MultiViews +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # Pojistka: nikdy neservírovat dotfiles (.env, .git, .htpasswd…)
    <LocationMatch "/\.">
        Require all denied
    </LocationMatch>

    # Pomocné PHP soubory (_bootstrap.php, _mail_template.php) nejdou volat přímo
    <FilesMatch "^_">
        Require all denied
    </FilesMatch>

    # Skutečná IP klienta z HAProxy (jen pro rate limit v PHP, do DB se neukládá)
    RemoteIPHeader X-Forwarded-For
    RemoteIPInternalProxy 127.0.0.1

    # HAProxy ukončuje TLS → PHP má vědět, že spojení je HTTPS
    SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on

    # PHP přes PHP-FPM
    <FilesMatch "\.php$">
        SetHandler "proxy:unix:/run/php/php8.3-fpm.sock|fcgi://localhost"
    </FilesMatch>

    # Admin funnel za basic auth (soubor mimo document root)
    <Location /admin>
        AuthType Basic
        AuthName "aijunior admin"
        AuthUserFile /etc/apache2/.htpasswd-aijunior
        Require valid-user
    </Location>

    # Bezpečnostní hlavičky
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set X-Frame-Options "DENY"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"
    Header always set Strict-Transport-Security "max-age=31536000"

    # Cache statiky (data/*.json se mění jen při novém stažení)
    <LocationMatch "\.(css|js|woff2|svg|png|jpg|webp)$">
        Header set Cache-Control "public, max-age=604800"
    </LocationMatch>
    <LocationMatch "\.json$">
        Header set Cache-Control "public, max-age=3600"
    </LocationMatch>

    ErrorLog ${APACHE_LOG_DIR}/aijunior-error.log
    CustomLog ${APACHE_LOG_DIR}/aijunior-access.log combined
</VirtualHost>
